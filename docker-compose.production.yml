name: saldoa-production

x-app: &app
    image: saldoa-app:${SALDOA_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
        APP_NAME: Saldoa
        APP_ENV: production
        APP_DEBUG: 'false'
        APP_KEY: ${APP_KEY:?Set a dedicated APP_KEY}
        APP_URL: https://${SALDOA_HOST:?Set the public hostname}
        APP_LOCALE: pt_BR
        APP_FALLBACK_LOCALE: pt_BR
        LOG_CHANNEL: stderr
        LOG_LEVEL: info
        DB_CONNECTION: mysql
        DB_HOST: database
        DB_PORT: '3306'
        DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
        DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
        SESSION_DRIVER: database
        SESSION_SECURE_COOKIE: 'true'
        SESSION_SAME_SITE: lax
        CACHE_STORE: database
        QUEUE_CONNECTION: database
        FILESYSTEM_DISK: local
        DEMO_INSTANCE: 'false'
        DEMO_LOGIN_ENABLED: 'false'
        SANCTUM_TOKEN_EXPIRATION: '14400'
        MAIL_MAILER: smtp
        MAIL_HOST: ${MAIL_HOST:?Set the SMTP host}
        MAIL_PORT: ${MAIL_PORT:-587}
        MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
        MAIL_USERNAME: ${MAIL_USERNAME:?Set the SMTP username}
        MAIL_PASSWORD: ${MAIL_PASSWORD:?Set the SMTP password}
        MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set an authorized sender}
        MAIL_FROM_NAME: Saldoa
    volumes:
        - app-storage:/var/www/html/storage
    depends_on:
        database:
            condition: service_healthy
    logging:
        driver: json-file
        options:
            max-size: 10m
            max-file: '3'

services:
    database:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
            MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
        secrets:
            - mysql_root_password
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                - CMD-SHELL
                - 'MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysql -uroot --execute="SELECT 1" >/dev/null 2>&1'
            interval: 10s
            timeout: 5s
            retries: 20
            start_period: 30s
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

    app:
        <<: *app
        build:
            context: .
            dockerfile: docker/Dockerfile.production
            target: app

    web:
        image: saldoa-web:${SALDOA_IMAGE_TAG:-local}
        build:
            context: .
            dockerfile: docker/Dockerfile.production
            target: web
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        environment:
            SALDOA_HOST: ${SALDOA_HOST:?Set the public hostname}
            TLS_EMAIL: ${TLS_EMAIL:?Set the certificate contact email}
        volumes:
            - caddy-data:/data
            - caddy-config:/config
        depends_on:
            - app
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

    scheduler:
        <<: *app
        user: www-data
        command: ['php', 'artisan', 'schedule:work', '--no-interaction']
        stop_grace_period: 75s

    worker:
        <<: *app
        user: www-data
        command:
            [
                'php',
                'artisan',
                'queue:work',
                'database',
                '--sleep=3',
                '--tries=3',
                '--timeout=60',
                '--no-interaction',
            ]
        stop_grace_period: 75s

secrets:
    mysql_root_password:
        file: ./.secrets/mysql-root-password

volumes:
    mysql-data:
    app-storage:
    caddy-data:
    caddy-config:
